<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Livraison</title>
<style>
  body { margin: 0; padding: 14px 16px; font: 14px/1.4 "Inter", "Segoe UI", system-ui, sans-serif; color: #1d1d1d; background: #fff; }
  h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500; }
  .opt { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid #eee; }
  .opt button { border: 1px solid #ddd; border-radius: 6px; background: #fafafa; padding: 2px 8px; font: inherit; font-size: 12px; }
</style>
</head>
<body>
  <h3>Livraison</h3>
  <div class="opt" data-testid="ship-standard"><span>Standard · 3 à 5 jours</span><button class="choose">Choisir</button></div>
  <div class="opt" data-testid="ship-express"><span>Express · demain</span><button class="choose">Choisir</button></div>
<script>
  // Witness for the QA: a click that reached this frame is counted (annotation mode must consume it).
  document.addEventListener('click', () => { document.body.dataset.clicks = String(+(document.body.dataset.clicks || 0) + 1); });
</script>
</body>
</html>
