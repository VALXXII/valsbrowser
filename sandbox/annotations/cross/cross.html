<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PayCo</title>
<style>
  body { margin: 0; padding: 14px 16px; font: 14px/1.4 system-ui, sans-serif; color: #fff; background: linear-gradient(135deg, #2f4fd9, #6a3fd9); height: 100vh; box-sizing: border-box; }
  b { font-size: 16px; }
  .pill { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: #ffffff2e; font-size: 12px; }
</style>
</head>
<body>
  <b>PayCo</b><br>Paiement sécurisé par un tiers (autre origine)
  <div class="pill" id="inside-cross">Contenu inaccessible au script d'annotation</div>
<script>
  // Witness for the QA: a click that reached this cross-origin frame changes the pill.
  let clicks = 0;
  document.addEventListener('click', () => { clicks++; document.getElementById('inside-cross').textContent = 'Clics reçus : ' + clicks; });
</script>
</body>
</html>
