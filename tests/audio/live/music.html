<!doctype html><meta charset="utf-8"><title>music</title>
<body style="background:#222;color:#ccc;font:14px sans-serif">
<p>Per-site volume live test: a 30 s, very faint 440 Hz tone (amplitude 0.002) in an &lt;audio&gt; element, with Media Session metadata.</p>
<script>
// 30 s mono 16-bit WAV, generated locally (no network).
const rate=8000,seconds=30,n=rate*seconds,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
const s=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.round(Math.sin(2*Math.PI*440*i/rate)*32767*0.002),true);
const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));a.loop=true;
let events=0;a.addEventListener('volumechange',()=>{events++;show();});
a.volume=0.8; // the site's own slider
const show=()=>{document.title='v='+a.volume.toFixed(2)+' e='+events+' p='+a.paused+' t='+a.currentTime.toFixed(1)+' r='+a.readyState+(a.error?' err='+a.error.code:'')+' play='+failure;};
navigator.mediaSession.metadata=new MediaMetadata({title:'Test Music',artist:'Lisiere QA',album:'Live'});
let failure='';a.play().then(()=>{failure='ok';}).catch(e=>{failure=e.name;});
setInterval(show,500);show();
</script>
